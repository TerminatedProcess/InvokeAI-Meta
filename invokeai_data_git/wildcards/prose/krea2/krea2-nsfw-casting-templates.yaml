# =============================================================================
# Krea 2 NSFW CASTING-SHEET templates (LoRA multi-pose progression product)
# Tags: __uw-krea2-nsfw-casting/router|template|leaf|pool/*__
# Root key: uw-krea2-nsfw-casting
# version: 6
# =============================================================================
#
# WHY THIS FILE EXISTS (READ BEFORE EDITING)
# ------------------------------------------
# This is NOT a normal Krea 2 room/selfie template file.
# Normal __uw-krea2-nsfw/*__ templates build one cohesive eight-clause photographic
# paragraph (medium → subject → single pose → wardrobe → environment → lighting →
# camera → treatment) for a single figure in one stance.
#
# Casting-sheet prompts describe ONE widescreen image that contains the SAME
# character repeated in a LEFT-TO-RIGHT sequence of poses (typically 5 panels).
# The Casting LoRA was trained on a rigid natural-language formula. Drifting too
# far from that formula reduces reliability (author: "if you change the base
# prompt too much you might need to cherrypick").
#
# WORD BUDGET — EXPLICITLY EXEMPTED
# ---------------------------------
# Pack-wide guidance (~110–130 words, hard max ~140) does NOT apply here.
# Multi-pose sequences require long pose clauses. Expansions routinely exceed
# 140–200+ words. Do not "fix" casting templates by trimming pose language
# down to the room-template budget. Keep formula fidelity first.
#
# LoRA TAGS
# ---------
# Do NOT embed <lora:...> strings in this file. Load the Casting LoRA (and any
# character LoRAs) in the ComfyUI workflow / Lora Manager. Wildcard text is
# prompt language only.
#
# SFW / NSFW
# ----------
# NSFW product. Pull identity from __uw-shared/common/*__ and optional outfit
# atoms from __uw-shared/nsfw/wardrobe/*__. Never pull __uw-shared/sfw/*__.
#
# ROUTER RULE
# -----------
# Register templates ONLY under
#   __uw-krea2-nsfw-casting/router/landscape-casting-sheet-pics__
# Never add these L2s to bedroom/bathroom/hotel/… room routers in
# krea2-nsfw-templates.yaml.
#
# ASPECT / RESOLUTION (workflow, not wildcard text)
# -------------------------------------------------
# Author trained at 1696x1024; also suggests other wide sizes (e.g. 1920x1088).
# Use a landscape canvas when testing these tags.
#
# BASE FORMULA (author)
# ---------------------
# A realistic photograph of a [DESCRIBE SUBJECT], she is posing in 5 different
# [DESCRIBE VIEW] poses, the first pose on the left she is wearing clothes and
# facing the viewer, the second pose she is naked nude and facing to the right,
# the third pose she is naked nude facing the viewer, the fourth pose she is
# naked nude facing to the left, the fifth pose she is naked nude facing away
# from the viewer showing her butt, the background is [DESCRIBE BACKGROUND]
#
# AUTHOR EXAMPLE PROMPTS (reference — do not copy LoRA tags into expansions)
# --------------------------------------------------------------------------
# Example A:
# A realistic photograph of beautiful rlyhelena, with long hair, flawless skin,
# big beautiful eyes and long eyelashes and a smile. she is posing in 5 different
# standing, thighs up poses, the first pose on the left she is wearing a white
# fishnet leotard and facing the viewer, the second pose she is naked nude and
# facing to the right, the third pose she is naked nude with her full front
# facing the viewer, the fourth pose she is naked nude facing to the left, the
# fifth pose she is naked nude facing away from the viewer showing her butt,
# the background is a continuous white photo studio backdrop
#
# Example B:
# A realistic photograph of a cute 25-year-old woman. She has big eyes, fair skin,
# pink blush, and winged eyeliner, long platinum blonde hair and bangs. She is
# posing in 6 different full body poses, the first pose on the left she is naked
# nude on her hands and knees on a chair facing away from the viewer with her
# butt up, the second pose she is naked nude and facing to the right, the third
# pose she is naked nude facing the viewer, the fourth pose she is naked nude
# facing to the left, the fifth pose she is naked nude facing away from the
# viewer showing her butt, the sixth pose she is naked nude facing the viewer
# with cum spattered all over her face and hair, the background is an office.
# Highly detailed, sharp focus, high contrast.
#
# Example C (lingerie progression / cosplay first panel):
# A realistic photograph of a blonde 34 year old woman, she is posing in 5
# different poses, the first pose on the left she is wearing clothes an anime
# cosplay of sailor moon and facing the viewer, the second pose she is wearing
# underwear and bra and facing to the right, the third pose she is she is wearing
# underwear and bra facing the viewer, the fourth pose she is she is wearing
# underwear and bra facing to the left, the fifth pose she is she is wearing
# underwear and bra facing away from the viewer showing her butt, the background
# is in a nerd convention
#
# V1 TEMPLATE IDEAS IN THIS FILE
# ------------------------------
# 1) casting-sheet-clothed-to-nude
#    Panel 1 clothed facing viewer → panels 2–5 nude angle ladder.
# 2) casting-sheet-dynamic-then-nude-angles
#    Panel 1 clothed dynamic pose → panels 2–5 nude angle ladder.
# 3) casting-sheet-dynamic-then-undress
#    Panel 1 clothed dynamic pose → panels 2–5 correlated undress (one garment
#    removed per panel with facing turns).
# 4) casting-sheet-dynamic-then-undress-front
#    Panel 1 clothed dynamic pose → panel 2 top-off facing right → panel 3
#    lowers-off facing left → panel 4 bra-off panties-only diagonal lookback
#    (butt toward frame corner, face over shoulder at camera) → panel 5 nude
#    facing viewer in a cute pose.
# 5) casting-sheet-dynamic-then-undress-front-action
#    Same P1–P4 ladder as undress-front; panel 5 starts "naked nude" then nests a
#    shared solo action pose (fingering / toy / hitachi / panties-aside). Nude +
#    panties-aside is intentional (panties pulled aside on an otherwise nude body).
#    No partner actions. Separate L2 from cute P5 closer.
#
# OUT OF SCOPE FOR V1
# -------------------
# 6-pose / cum-finish variants, character-trigger appendices, SFW casting,
# inline LoRA tags, registering into room routers.
# =============================================================================

