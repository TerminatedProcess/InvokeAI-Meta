# Depth: max 3 key levels under uw-shared -> fantasy -> element -> family
# Fantasy templates pull __uw-shared/common/*__ + __uw-shared/fantasy/*__ only (not sfw; not room nsfw wardrobe/env/pose).
# Scene-locked identity routers pick race-specialized identity-paragraph/<race> (hair/eyes/skin/mods correlated).
# Tier A races: human-base + fantasy mods; ethnicity/nationality OK (incl. blood-elf / valkyrie / goddess).
# Tier B races (goblin): ethnicity-incompatible — identity paragraphs omit nationality / ethnicity-hair.
# Positive wording only (Krea 2). Human base always; no full-fur. Catgirl/foxgirl affirm human skin/limbs.
# Fantasy-selfie and fantasy-action shot/camera/pose are LOCAL copies — do NOT pull __uw-shared/nsfw/shot|camera|pose/*__.
# Exception (Batch C missionary): fantasy-action-partner-missionary(+wide) reuse nsfw camera/intimate-documentary + finish/missionary-side|landscape for correlated finish.
# version: 53
