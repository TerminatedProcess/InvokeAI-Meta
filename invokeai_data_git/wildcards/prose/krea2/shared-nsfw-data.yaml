      - 3::photographed on a casual phone camera with shallow depth and off-balance framing, handheld phone snapshot grade, digital grain, crushed shadow detail, imperfect JPEG color
      - 1::shot on a 35mm lens with natural perspective and shallow depth, refined filmic color, soft falloff, cinematic still-frame quality
