simple_underwear:
  Random:
    - "__simple_underwear/TopColor__ __simple_underwear/Top__ and mismatching __simple_underwear/BottomColor__ __simple_underwear/Bottom__"
    - "__simple_underwear/BottomColor__ __simple_underwear/BottomPattern__ __simple_underwear/Bottom__ and mismatching __simple_underwear/TopColor__ __simple_underwear/TopPattern__ __simple_underwear/Top__"
    - "__simple_underwear/BottomColor__ __simple_underwear/BottomPattern__ __simple_underwear/Bottom__ with __simple_underwear/BottomDecorations__ and mismatching __simple_underwear/TopColor__ __simple_underwear/TopPattern__ __simple_underwear/Top__ with __simple_underwear/TopDecorations__"
    

